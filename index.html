<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OngTong AI</title>
<style>
  :root{--ink:#0f2a4a;--muted:#4b5b6e;--accent:#06c755;--bg1:#fff9dc;--bg2:#e6f7ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--bg1),var(--bg2))}
  main{max-width:560px;width:100%;background:#fff;border-radius:24px;padding:40px 28px;box-shadow:0 10px 40px rgba(15,42,74,.12);text-align:center}
  h1{font-size:2.4rem;letter-spacing:-.02em}
  p.lead{margin:12px 0 28px;color:var(--muted);font-size:1.1rem;line-height:1.6}
  a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:999px;font-size:1.05rem}
  a.btn:hover{filter:brightness(.95)}
  small{display:block;margin-top:28px;color:#8793a3}
</style>
</head>
<body>
<main>
  <h1>OngTong AI</h1>
  <p class="lead">ผู้ช่วยอัจฉริยะบน LINE<br>ดูข้อมูล บริการ หลักสูตร และข่าวสาร</p>
  <a class="btn" href="https://line.me/R/ti/p/%40041vdnqv">เพิ่มเพื่อนใน LINE</a>
  <small>หน้านี้เป็นหน้าแรกเบื้องต้นของ OngTong AI</small>
</main>
</body>
</html>
